name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install mobile dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npm run typecheck
      - name: Lint (errors only; warning backlog tracked separately)
        run: npm run lint
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate Expo configuration
        run: npx expo config --json > /dev/null
      - name: Bundle Android
        run: CI=1 npx expo export --platform android --output-dir /tmp/pawso-android
      - name: Bundle iOS
        run: CI=1 npx expo export --platform ios --output-dir /tmp/pawso-ios

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile main.py ask_router.py auth.py rate_limit.py upload_validation.py
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Dependency vulnerability scan
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
